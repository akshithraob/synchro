<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline · Synchro</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f6faf8; color: #182522; text-align: center; padding: 24px; }
      @media (prefers-color-scheme: dark) { body { background: #0e1715; color: #e6f0ed; } }
      main { max-width: 360px; }
      h1 { font-size: 22px; margin: 12px 0 6px; }
      p { color: #5b6f6a; line-height: 1.5; }
      button { margin-top: 16px; padding: 10px 18px; border: 0; border-radius: 10px; background: #087f70; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" width="72" height="72" alt="" />
      <h1>You’re offline</h1>
      <p>Synchro needs a connection to load events and confirm registrations. Nothing you tried has been submitted. Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
